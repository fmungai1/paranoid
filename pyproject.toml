[project]
name = "paranoid"
dynamic = ["version"]
description = "Remake of the classic Paranoid game"
authors = [{name = "Fredrick Mungai", email = "fmungai1@paranoid.bbb"}]
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = "^3.10"
dependencies = [
    "arcade",
]

[tool.poetry]
version = "1.1.0"
packages = [{include = "paranoid", from = "src"}]
requires-poetry = ">=2.0"

[tool.poetry.dependencies]
python = "^3.10"
arcade = "*"


[tool.poetry.group.dev.dependencies]
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 88
unfixable = [
    "ERA",  # do not autoremove commmented out code
]
extend-select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ERA",  # flake8-eradicate/eradicate
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "PGH",  # pygrep
    "RUF",  # ruff checks
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
]

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.black]
target-version = ["py310"]
preview = true

[tool.isort]
profile = "black"
force_grid_wrap = 2
