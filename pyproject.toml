[tool.poetry]
name = "paranoid"
version = "1.1.0"
description = "Remake of the classic Paranoid game"
authors = ["Fredrick Mungai <https://github.com/fmungai1>"]
readme = "README.md"
packages = [{include = "paranoid", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
arcade = "*"


[tool.poetry.group.dev.dependencies]
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
